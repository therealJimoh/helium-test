name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: helium-test
  GO_VERSION: "1.24"

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: app

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  validate-infra:
    name: Validate Dockerfile, k8s & Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s | ./kubeconform -strict -summary -

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: terraform fmt
        run: terraform fmt -recursive -check terraform

      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/environments/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  build-scan-push:
    name: Build, scan & push
    runs-on: ubuntu-latest
    needs: [lint-test, validate-infra]
    permissions:
      contents: read
      id-token: write # OIDC federation to AWS, no long-lived keys.
      security-events: write # Upload Trivy SARIF to the Security tab.
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Gate: fail the build on fixable HIGH/CRITICAL findings before anything is pushed.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LOCAL: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker tag "$LOCAL" "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          echo "Pushed \`$REGISTRY/$REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

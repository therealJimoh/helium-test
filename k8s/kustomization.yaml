apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helium-test
labels:
  - pairs:
      app.kubernetes.io/part-of: helium-test
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
images:
  - name: helium-test
    newName: helium-test/dummy
    newTag: "0.0.0"
